name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The client's types are generated from the OpenAPI document committed on the API's main
      # branch. A difference means the API changed and the SPA has not caught up, or the other way round.
      - name: API client matches the API
        run: npm run api:sync && git diff --exit-code -- src/shared/api

      # Dependency scan: fails when a package, direct or transitive, has a known vulnerability of high or
      # critical severity (spec section 13).
      - name: Scan dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # Builds the nginx image on the newest base, then scans it. A vulnerability of high or critical severity that
  # has a fix fails the job; one with no fix yet cannot be acted on, so it does not.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull -t pfm-spa .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pfm-spa
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
