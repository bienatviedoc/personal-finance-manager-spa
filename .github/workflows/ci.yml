name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The client's types are generated from the OpenAPI document committed on the API's main
      # branch. A difference means the API changed and the SPA has not caught up, or the other way round.
      - name: API client matches the API
        run: npm run api:sync && git diff --exit-code -- src/shared/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
